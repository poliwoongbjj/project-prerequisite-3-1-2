<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" 
      xmlns:th="https://www.thymeleaf.org" 
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <title>Admin Panel</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Top Header Bar -->
    <div class="bg-dark text-white p-2 d-flex justify-content-between align-items-center">
        <span class="ms-3 fs-6">
            <span th:text="${#authentication.name}">admin@admin</span>
            &nbsp;with roles&nbsp;
            <span th:with="hasAdmin=${#lists.contains(#authentication.authorities.![authority], 'ROLE_ADMIN')}" th:text="${hasAdmin ? '[ADMIN]' : '[USER]'}">[ADMIN]</span>
        </span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-link text-light text-decoration-none opacity-75" type="submit">Logout</button>
        </form>
    </div>

    <div class="d-flex">
        <!-- Left Sidebar -->
        <div class="bg-white border-end" style="width: 200px; min-height: calc(100vh - 60px);">
            <div class="pt-3">
                <div class="mb-2">
                    <a href="/admin" class="btn btn-primary w-100 text-center">Admin</a>
                </div>
                <div class="mb-0">
                    <a href="/admin/user" class="btn btn-link text-primary w-100 text-center text-decoration-none">User</a>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="bg-light flex-grow-1 p-4">
            <h2 class="mb-4 fw-bold">Admin Panel</h2>
            
            <!-- Navigation Tabs -->
            <ul class="nav nav-tabs mb-0">
                <li class="nav-item">
                    <a class="nav-link active" href="#">All Users</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/users/new">New User</a>
                </li>
            </ul>
            
            <!-- All Users Section -->
            <div class="card mb-4 rounded">
                <div class="card-header bg-light border-bottom p-3 d-flex justify-content-between align-items-center">
                    <h6 class="mb-0 fw-bold">All Users</h6>
                    <button id="refreshUsers" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-arrow-clockwise"></i> Refresh
                    </button>
                </div>
                <div class="card-body p-3">
                    <table class="table mb-0">
                        <thead>
                            <tr class="border-top border-secondary">
                                <th class="border-0">ID</th>
                                <th class="border-0">First Name</th>
                                <th class="border-0">Last Name</th>
                                <th class="border-0">Age</th>
                                <th class="border-0">Email</th>
                                <th class="border-0">Roles</th>
                                <th class="border-0">Edit</th>
                                <th class="border-0">Delete</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="8" class="text-center border-0">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Admin JavaScript -->
<script src="/js/admin.js"></script>
</body>
</html>
